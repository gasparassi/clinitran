<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <title>Ilustração da fachada da Clinitran</title>
  <!-- Céu -->
  <rect width="600" height="450" rx="24" fill="#DCEBFA"/>
  <!-- Fios de energia -->
  <path d="M0 40 Q 300 75 600 30" stroke="#2B2F36" stroke-width="2" fill="none"/>
  <path d="M0 55 Q 300 95 600 48" stroke="#2B2F36" stroke-width="2" fill="none"/>
  <!-- Prédio vizinho -->
  <rect x="440" y="120" width="160" height="260" fill="#E8E2D6"/>
  <rect x="470" y="200" width="70" height="80" fill="#B65A4A" opacity="0.5"/>
  <!-- Fachada laranja -->
  <rect x="20" y="80" width="420" height="300" fill="#E07B2E"/>
  <!-- Placa branca -->
  <rect x="40" y="96" width="380" height="96" rx="6" fill="#FFFFFF" stroke="#D0CBC2" stroke-width="2"/>
  <text x="230" y="146" text-anchor="middle" font-family="'Exo 2', Arial, sans-serif" font-size="44" font-weight="800" font-style="italic" fill="#C9A227" stroke="#7A5C0E" stroke-width="1.5" paint-order="stroke">CliniTran</text>
  <text x="230" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2B2F36">EXAMES DE RENOVAÇÃO PARA CNH  •  A B C D E</text>
  <!-- Janela com grade -->
  <rect x="55" y="225" width="160" height="110" fill="#2B2F36" stroke="#F3D2B5" stroke-width="5"/>
  <g stroke="#9AA0A8" stroke-width="3">
    <line x1="95" y1="225" x2="95" y2="335"/>
    <line x1="135" y1="225" x2="135" y2="335"/>
    <line x1="175" y1="225" x2="175" y2="335"/>
    <line x1="55" y1="280" x2="215" y2="280"/>
  </g>
  <!-- Porta com portão -->
  <rect x="275" y="215" width="110" height="165" fill="#2B2F36" stroke="#F3D2B5" stroke-width="5"/>
  <g stroke="#9AA0A8" stroke-width="3">
    <line x1="297" y1="215" x2="297" y2="380"/>
    <line x1="319" y1="215" x2="319" y2="380"/>
    <line x1="341" y1="215" x2="341" y2="380"/>
    <line x1="363" y1="215" x2="363" y2="380"/>
  </g>
  <rect x="310" y="255" width="40" height="30" fill="#FFFFFF"/>
  <!-- Calçada e rua -->
  <rect y="380" width="600" height="18" fill="#C9C4BA"/>
  <path d="M0 398 H600 V426 Q 600 450 576 450 H24 Q 0 450 0 426 Z" fill="#5A5F66"/>
  <!-- Poste e placa de escola -->
  <rect x="560" y="100" width="12" height="280" fill="#B8B2A6"/>
  <rect x="528" y="150" width="44" height="44" fill="#F2C230" stroke="#2B2F36" stroke-width="3" transform="rotate(45 550 172)"/>
  <circle cx="545" cy="166" r="4" fill="#2B2F36"/>
  <circle cx="556" cy="168" r="4" fill="#2B2F36"/>
  <path d="M541 172 L 541 184 M 556 174 L 556 184" stroke="#2B2F36" stroke-width="3"/>
</svg>
