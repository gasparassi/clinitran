<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <title>Ilustração de uma estrada com placas de trânsito</title>
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D5FA6"/>
      <stop offset="1" stop-color="#2B2F36"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#ceu)"/>
  <circle cx="980" cy="200" r="70" fill="#C9A227" opacity="0.85"/>
  <!-- Terreno e estrada em perspectiva -->
  <rect y="260" width="1200" height="240" fill="#3A3F47"/>
  <polygon points="840,260 920,260 1200,500 560,500" fill="#1F2228"/>
  <g fill="#C9A227">
    <polygon points="878,270 882,270 884,300 876,300"/>
    <polygon points="874,325 886,325 890,375 870,375"/>
    <polygon points="866,410 894,410 902,500 858,500"/>
  </g>
  <!-- Placa de escola (losango amarelo) -->
  <g transform="translate(640 150)">
    <rect x="-6" y="40" width="12" height="160" fill="#9AA0A8"/>
    <rect x="-42" y="-42" width="84" height="84" fill="#F2C230" stroke="#1F2228" stroke-width="5" transform="rotate(45)"/>
    <circle cx="-12" cy="-14" r="7" fill="#1F2228"/>
    <circle cx="14" cy="-10" r="6" fill="#1F2228"/>
    <path d="M-20 -4 L -4 -4 L -8 26 M 6 0 L 20 0 L 18 24" stroke="#1F2228" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Placa de regulamentação (círculo vermelho) -->
  <g transform="translate(1110 200)">
    <rect x="-6" y="40" width="12" height="160" fill="#9AA0A8"/>
    <circle r="48" fill="#FFFFFF" stroke="#C0392B" stroke-width="12"/>
    <path d="M-14 22 L -14 -8 Q -14 -20 0 -20 L 14 -20" stroke="#1F2228" stroke-width="8" fill="none"/>
    <polygon points="12,-32 28,-20 12,-8" fill="#1F2228"/>
    <line x1="-30" y1="-30" x2="30" y2="30" stroke="#C0392B" stroke-width="9"/>
  </g>
</svg>
