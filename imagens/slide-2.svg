<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <title>Ilustração de tabela de exame de vista e carteira de motorista</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F2228"/>
      <stop offset="1" stop-color="#2B2F36"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg2)"/>
  <circle cx="1000" cy="430" r="230" fill="#E07B2E" opacity="0.15"/>
  <!-- Tabela de acuidade visual -->
  <g transform="translate(860 40)">
    <rect width="270" height="400" rx="16" fill="#FFFFFF"/>
    <g font-family="Arial, sans-serif" font-weight="700" fill="#2B2F36" text-anchor="middle">
      <text x="135" y="110" font-size="90">E</text>
      <text x="135" y="185" font-size="52" letter-spacing="14">F P</text>
      <text x="135" y="240" font-size="36" letter-spacing="10">T O Z</text>
      <text x="135" y="285" font-size="26" letter-spacing="8">L P E D</text>
      <text x="135" y="320" font-size="18" letter-spacing="6">P E C F D</text>
      <text x="135" y="348" font-size="13" letter-spacing="5">E D F C Z P</text>
    </g>
    <rect x="20" y="365" width="230" height="6" rx="3" fill="#E07B2E"/>
  </g>
  <!-- Carteira de motorista genérica -->
  <g transform="translate(560 250) rotate(-8)">
    <rect width="300" height="190" rx="14" fill="#FFF8F1"/>
    <rect width="300" height="46" rx="14" fill="#E07B2E"/>
    <rect y="30" width="300" height="16" fill="#E07B2E"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">CNH</text>
    <text x="200" y="32" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">A B C D E</text>
    <rect x="20" y="66" width="80" height="100" rx="8" fill="#D9D4CC"/>
    <circle cx="60" cy="100" r="18" fill="#9AA0A8"/>
    <path d="M30 160 Q 60 120 90 160 Z" fill="#9AA0A8"/>
    <g fill="#C9A227">
      <rect x="120" y="76" width="150" height="10" rx="5"/>
      <rect x="120" y="102" width="110" height="10" rx="5"/>
      <rect x="120" y="128" width="140" height="10" rx="5"/>
    </g>
  </g>
</svg>
