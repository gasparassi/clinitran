# Publica a parte estática do site (HTML, CSS, JS e imagens) no GitHub Pages.
# O GitHub Pages não executa PHP: o formulário oferece o envio pelo WhatsApp
# e a área administrativa não é publicada.

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'imagens/**'
      - 'videos/**'
      - 'paginas/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: # permite publicar manualmente pela aba "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Separar somente os arquivos estáticos
        run: |
          mkdir _site
          cp index.html _site/
          for pasta in css js imagens videos paginas; do
            if [ -d "$pasta" ]; then cp -r "$pasta" _site/; fi
          done
          # Remove os arquivos PHP (o GitHub Pages não os executa)
          find _site -name '*.php' -delete
          find _site -type d -empty -delete
          touch _site/.nojekyll

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
