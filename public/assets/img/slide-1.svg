<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <title>Ilustração de um volante com um olho no centro</title>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2F36"/>
      <stop offset="1" stop-color="#B85A16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg1)"/>
  <circle cx="1100" cy="60" r="180" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="100" cy="470" r="200" fill="#FFFFFF" opacity="0.04"/>
  <!-- Volante -->
  <g transform="translate(870 250)">
    <circle r="210" fill="#E07B2E"/>
    <circle r="165" fill="#FFF8F1"/>
    <rect x="-200" y="-20" width="90" height="40" rx="10" fill="#E07B2E"/>
    <rect x="110" y="-20" width="90" height="40" rx="10" fill="#E07B2E"/>
    <rect x="-20" y="85" width="40" height="120" rx="10" fill="#E07B2E"/>
    <!-- Olho -->
    <path d="M-120 0 C -75 -80, 75 -80, 120 0 C 75 80, -75 80, -120 0 Z" fill="#2B2F36"/>
    <circle r="56" fill="#C9A227"/>
    <circle r="24" fill="#2B2F36"/>
    <circle cx="20" cy="-20" r="11" fill="#FFFFFF"/>
  </g>
</svg>
